[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/ssh"]

[workspace.package]
version = "1.0.2-Alpha1"
edition = "2021"
license = "MIT"
authors = ["Portio contributors"]

[workspace.dependencies]
portio-core = { path = "crates/core" }
portio-ssh = { path = "crates/ssh" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
